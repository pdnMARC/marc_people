name: Profile Form Sync

on:
  schedule:
    # At 18:30 UTC every day (00:00 midnight in Sri Lanka)
    - cron: "30 18 * * *"
  # Enables a "Run workflow" button on the Actions tab
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: profile-form-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Open pull requests for new form responses
        env:
          # Response sheet as CSV (google-form/README.md, step 5)
          FORM_RESPONSES_CSV: ${{ secrets.GOOGLE_FORM_CSV_LINK }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node scripts/form-sync.mjs
